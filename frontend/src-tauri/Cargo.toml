[package]
name = "airbench-desktop"
version = "0.1.0"
description = "AirBench sovereign desktop workbench"
authors = ["AirBench"]
edition = "2021"

[lib]
name = "airbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
hex = "0.4.3"
keyring = { version = "4.2.0", default-features = true }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["v4"] }
rfd = { version = "0.17.2", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]
