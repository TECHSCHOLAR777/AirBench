$schema: "https://json-schema.org/draft/2020-12/schema"
title: AirBench Remote Endpoint Profile
type: object
additionalProperties: false
required:
  - endpoint_id
  - endpoint_url
  - provider_type
  - backend_type
  - model_target_id
  - artifact_digest
  - tokenizer_digest
  - chat_template_digest
  - runtime_version
  - adapter_id
  - adapter_version
  - capabilities
  - roles
  - modalities
  - risk_classes
  - allowed_clearances
  - license_id
  - qualification_reference
  - qualification_expires_at
  - qualification_signature
  - execution_location
  - remote_execution_policy
  - data_egress_policy
  - allowed_hosts
  - credential_env
properties:
  endpoint_id: {type: string, pattern: "^[a-z0-9][a-z0-9._:-]{0,127}$"}
  endpoint_url: {type: string, format: uri, pattern: "^https://"}
  provider_type: {type: string, minLength: 1}
  backend_type: {type: string, minLength: 1}
  model_target_id: {type: string, minLength: 1}
  artifact_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
  tokenizer_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
  chat_template_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
  runtime_version: {type: string, minLength: 1}
  adapter_id: {type: string, minLength: 1}
  adapter_version: {type: string, minLength: 1}
  capabilities: {type: array, items: {type: string}, minItems: 1}
  roles: {type: array, items: {type: string}, minItems: 1}
  modalities: {type: array, items: {type: string}, minItems: 1}
  risk_classes: {type: array, items: {type: string}, minItems: 1}
  allowed_clearances:
    type: array
    items: {enum: [public, internal, restricted, secret]}
    minItems: 1
  license_id: {type: string, minLength: 1}
  qualification_reference: {type: string, minLength: 1}
  qualification_expires_at: {type: string, format: date-time}
  qualification_signature: {type: string, pattern: "^[0-9a-f]{64}$"}
  execution_location: {const: remote}
  remote_execution_policy: {const: approved_remote_endpoint}
  data_egress_policy: {const: approved_remote_endpoint}
  allowed_hosts: {type: array, items: {type: string}, minItems: 1}
  credential_env: {type: string, pattern: "^[A-Z][A-Z0-9_]{1,127}$"}
  timeout_ms: {type: integer, minimum: 1, maximum: 86400000}
  max_retries: {type: integer, minimum: 0, maximum: 5}
  streaming: {type: boolean}
  cancellation: {type: boolean}
  certificate_fingerprint: {type: string}
  retry_only_idempotent: {type: boolean}
  disabled: {type: boolean}
