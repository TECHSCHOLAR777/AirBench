# contracts/ledger_event_catalog.yaml
# Single source of truth for all valid ledger event type strings.
# Must stay in sync with LEDGER_EVENT_TYPES in contracts/models.py.
#
# Validation rule: any event written to the ledger whose type is not in this
# catalog must be rejected by the ledger's append guard.
#
# Section labels match the groups in LEDGER_EVENT_TYPES.

event_envelope: LedgerEventEnvelope
required_payload_fields:
  - task_id
  - actor_id
  - clearance
  - payload_contract
  - payload_version
  - payload_hash
  - idempotency_key
failure_rule: "ledger write failure blocks the consequential action"

events:
