event_envelope: LedgerEventEnvelope
events:
  - task.created
  - team.created
  - worker.assigned
  - worker.handoff
  - model.requested
  - model.route.decided
  - hardware.profile.loaded
  - resource.plan.created
  - resource.plan.admitted
  - resource.plan.queued
  - resource.exhaustion.detected
  - routing.decided
  - model.responded
  - model.failed
  - retrieval.requested
  - world_model.requested
  - verification.requested
  - tool.requested
  - tool.authorized
  - tool.result
  - tool.denied
  - evidence.created
  - fact.candidate
  - fact.committed
  - verification.completed
  - retry.started
  - escalation.required
  - human.signoff
  - completion.recorded
  - projection.rebuilt
  - projection.exported
  - checkpoint.committed
  - retry.completed
  - retry.failed
  - side_effect.reserved
  - side_effect.committed
  - side_effect.uncertain
  - recovery.resumed
  - crash.recovered
  - task.cancelled
required_payload_fields: [task_id, actor_id, clearance, payload_contract, payload_version, payload_hash, idempotency_key]
failure_rule: ledger write failure blocks the consequential action
