# models/roster/v0/model_roster.yaml
# M5.1 — Signed model roster manifest for AirBench v0 local deployment.
#
# HOW TO FILL IN MEASURED VALUES
# ================================
# After downloading the models with:
#
#   huggingface-cli download Qwen/Qwen3-Coder-30B-A3B-Instruct-AWQ \
#       --local-dir D:\airbench-models\qwen3-coder-30b-a3b-4bit
#
# Run the following PowerShell command to get each file's SHA-256:
#
#   Get-FileHash "D:\airbench-models\<model-dir>\<weight-file>.safetensors" -Algorithm SHA256 |
#       Select-Object -ExpandProperty Hash | ForEach-Object { $_.ToLower() }
#
# Replace every "REPLACE_WITH_MEASURED:<description>" placeholder below with the actual hash.
#
# Then re-sign the manifest:
#
#   python -c "
#   import hashlib, hmac, json, yaml
#   KEY = open('.airbench_signing_key', 'rb').read()   # keep this key secret
#   roster = yaml.safe_load(open('models/roster/v0/model_roster.yaml'))
#   unsigned = {k: v for k, v in roster.items() if k != 'signature'}
#   canonical = json.dumps(unsigned, sort_keys=True, separators=(',', ':')).encode()
#   sig = hmac.new(KEY, canonical, hashlib.sha256).hexdigest()
#   print('signature:', sig)
#   "
#
# DOWNLOAD LINKS (4-bit quantized, official):
# -------------------------------------------
# Gemma 4 26B A4B Q4_0 (workstation lead / fast lane):
#   huggingface-cli download google/gemma-4-26b-it-qat-q4_0-gguf \
#       --local-dir D:\airbench-models\gemma4-26b-a4b-4bit --include "*.gguf"
#
# Gemma 4 31B Q4 (full lead — 96 GB VRAM required):
#   - Model weights (safetensors):
#       huggingface-cli download google/gemma-4-31b-it-q4 --local-dir D:\airbench-models\gemma4-31b-it-q4
#   - Tokenizer, configs, chat templates:
#       (Included in the above download if pointing to the full Q4 repo)
#
# Qwen3-Coder 30B A3B AWQ (code worker):
#   huggingface-cli download Qwen/Qwen3-Coder-30B-A3B-Instruct-AWQ \
#       --local-dir D:\airbench-models\qwen3-coder-30b-a3b-4bit
#
# Qwen2.5-VL 7B AWQ (vision / evidence worker):
#   huggingface-cli download Qwen/Qwen2.5-VL-7B-Instruct-AWQ \
#       --local-dir D:\airbench-models\qwen2.5-vl-7b-4bit
#
# BAAI BGE-M3 (embedding service, CPU-friendly):
#   huggingface-cli download BAAI/bge-m3 \
#       --local-dir D:\airbench-models\bge-m3
#
# BAAI BGE-Reranker-v2-M3 (reranking service, CPU-friendly):
#   huggingface-cli download BAAI/bge-reranker-v2-m3 \
#       --local-dir D:\airbench-models\bge-reranker-v2-m3

