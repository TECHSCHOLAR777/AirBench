  schema_version: "1.0"
  created_at: "2026-09-06T00:00:00Z"   # update to actual creation timestamp
  hardware_profiles:
    - target_96gb_vram                  # profile_id from profiles/hardware/target_96gb_vram.yaml
  network_policy: air_gapped_no_egress
  serving_defaults:
    runtime: vllm
    backend: vllm
    network_policy: air_gapped_no_egress
    no_external_calls: true

  targets:

