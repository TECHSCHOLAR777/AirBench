      capabilities: ["lead_planning", "evidence_synthesis", "approval_note_draft", "reasoning"]
      modalities: ["text"]
      risk_classes: ["inspection_review", "high_consequence"]
      allowed_clearances: ["restricted", "internal", "public"]
