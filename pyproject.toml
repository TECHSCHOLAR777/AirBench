[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airbench"
version = "0.1.0"
description = "Sovereign, auditable AI workbench contracts"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "Pillow>=12.0,<13", "pypdf>=6.0,<7", "python-docx>=1.1,<2", "fastapi>=0.135,<1", "uvicorn>=0.44,<1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.28,<1"]
ocr = ["pypdfium2>=4.0,<5"]
vision = [
    "pytesseract>=0.3.10,<1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.0",
    "scikit-image>=0.20",
    "networkx>=3.0",
    "easyocr>=1.7",
]
deliverables = ["openpyxl>=3.1,<4", "python-pptx>=0.6.23,<2"]
vector = ["chromadb>=0.4,<1"]
embedding = ["sentence-transformers>=3,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["contracts*", "airbench*"]
